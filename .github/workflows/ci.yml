name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} · typecheck · lint · test · build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Permission runtime integration
        run: pnpm exec vitest run packages/ohbaby-agent/src/permission/permission.unit.test.ts packages/ohbaby-agent/src/permission/permission-lifecycle.unit.test.ts packages/ohbaby-agent/src/host/core-api-permission.integration.test.ts tests/integration/core/tool-scheduler-permission.integration.test.ts tests/integration/agents/permission-run-lifecycle.integration.test.ts tests/integration/agents/inprocess-child-permission.integration.test.ts

      - name: Permission projection and transport contracts
        run: pnpm exec vitest run packages/ohbaby-agent/src/adapters/app-events/permission-projection.unit.test.ts packages/ohbaby-agent/src/adapters/ui-inprocess.contract.test.ts packages/ohbaby-server/src/coordination/client-view.unit.test.ts packages/ohbaby-server/src/coordination/permission-router.unit.test.ts packages/ohbaby-server/src/coordination/permission-lifecycle.integration.test.ts packages/ohbaby-server/src/app/create-app.unit.test.ts

      - name: Permission clients and runtime coexistence
        run: pnpm exec vitest run apps/ohbaby-web/src/api/daemon/server-client.integration.test.ts apps/ohbaby-web/src/ui/App.unit.test.tsx packages/ohbaby-cli/src/tui/app.contract.test.tsx packages/ohbaby-agent/src/runtime/run-ledger/dual-writer-process.integration.test.ts packages/ohbaby-cli/src/bin.unit.test.ts packages/ohbaby-server/src/protocols/jsonrpc/client.unit.test.ts

      - name: Build
        run: pnpm build
